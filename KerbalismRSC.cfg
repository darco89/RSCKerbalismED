KERBALISMRSC_RSCCATEGORIES_KRSCRANGES
{
    // Each set represents a RSC scienceSpots potential science category (vlow, low, etc)
    // The Min/Max values represent the ranges (in percentage) that can be used 
    // to calculate the physical sample mass collected by one analysis.
    // The limits are defined by KERBALISMRSC_BIOME_SAMPLES.Biome.ExperimentMassKg and each analysis gives a fraction of it.

    vlow
    {
        Name = very low
        MinimumObtainableMassRoll = 0.04
        MaxObtainableMassRoll = 0.08
    }

    low
    {
        Name = low
        MinimumObtainableMassRoll = 0.08
        MaxObtainableMassRoll = 0.15
    }

    normal
    {
        Name = normal
        MinimumObtainableMassRoll = 0.15
        MaxObtainableMassRoll = 0.25
    }

    high
    {
        Name = high
        MinimumObtainableMassRoll = 0.25
        MaxObtainableMassRoll = 0.35
    }

    vhigh
    {
        Name = very high
        MinimumObtainableMassRoll = 0.35
        MaxObtainableMassRoll = 0.50
    }
}


// ============================================================
// ANOMALY
//
// All anomalies use the same fraction ranges to be used when calculating experiment mass gathered.
// RSC prediction does not affect anomalies' yields. KRSC will calculate anomalies science value independently.
// ============================================================

KERBALISMRSC_RSCANOMALY_KRSCRANGES
{
    MinimumObtainableMassRoll = 0.65
    MaxObtainableMassRoll = 1.00
}