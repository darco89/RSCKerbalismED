// ============================================================
// KerbalismRSC
//
// Defines the physical quantity and scientific value of samples
// available from RSC science spots.
//
// ExperimentMassKg:
//     Maximum physical sample that can be collected.
//
// SciencePerKgPercent:
//     Scientific value of one kilogram of sample, configured
//     per body.
//     100 = 1.00 science/kg
//      33 = 0.33 science/kg
//       0 = no science.
//
// ScaledScience:
//     Global percentage modifier applied to the calculated
//     science value.
//     100 = normal
//      50 = half science
//     200 = double science.
//
// Biome:
//     The exact KSP biome name returned by ScienceUtil.
//     The ConfigNode name itself is only a safe identifier and
//     is NOT used for biome matching.
//
// RSC potential categories determine the fraction of the
// configured physical sample collected by each analysis.
// ============================================================


KERBALISMRSC_SETTINGS
{
    // Global science "difficulty" modifier. 
    // Meant to reduce/increase total obtainable science from RSC, 
    // while maintainging KRSC's ExperimentMassKg & SciencePerKgPercent baseline defined in KERBALISMRSC_BIOME_SAMPLES

    ScaledScience = 100

    // 100 = normal science
    // 50  = half science
    // 200 = double science
}


