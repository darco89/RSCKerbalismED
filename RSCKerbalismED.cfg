// ============================================================
// RSCKerbalismED CONFIG
// ============================================================

// For general Mod settings
RSCKERBALISMED_SETTINGS
{
    // Not in use for now
    ScaledScience = 100
    // ScaledScience:
    //     Global percentage modifier applied to the calculated
    //     science value.
    //     100 = normal
    //      50 = half science
    //     200 = double science.

    
    // ============================================================
    // Configuration used to map RSC's "Actual Science Prediction"
    // with (our RSCKerbalismED's) Sample Mass modifiers to be applied
    //
    // NOTE:
    //   1) RSC considers "Actual Science Prediction" but also "Decay",
    //      and other modifiers to roll a final science value.
    //
    //   2) RSCKerbalismED considers only RSC's "Actual Science Prediction"
    //      and the fractions considered below to roll a final science value.
    //
    // Each set represents a RSC "potential science category" (vlow, low, etc)
    //
    // The Min/Max values represent the ranges (in percentage) that can be used
    // by RSCKerbalismED to roll the sample mass collected by one "RSC Science Analysis"
    //
    // MinimumObtainableMassRoll should be higher than zero
    // MaxObtainableMassRoll should be 1 or less. When =1, spots of
    // respective category might finish sample with a single Analysis.
    // ============================================================
    RSCCATEGORIES_RSCKERANGES
    {
        vlow
        {
            Name = very low
            MinimumObtainableMassRoll = 0.04
            MaxObtainableMassRoll = 0.08
        }

        low
        {
            Name = low
            MinimumObtainableMassRoll = 0.08
            MaxObtainableMassRoll = 0.15
        }

        normal
        {
            Name = normal
            MinimumObtainableMassRoll = 0.15
            MaxObtainableMassRoll = 0.25
        }

        high
        {
            Name = high
            MinimumObtainableMassRoll = 0.25
            MaxObtainableMassRoll = 0.35
        }

        vhigh
        {
            Name = very high
            MinimumObtainableMassRoll = 0.35
            MaxObtainableMassRoll = 0.50
        }

        // Anomalies are a special RSC "Actual Science Prediction" value.
        // RSC's anomalies are high-value science spots, not a bonus applied to a prediction.
        // All anomalies use the same fraction ranges to be used when calculating experiment mass gathered.
        anomaly
        {
            Name = anomaly
            MinimumObtainableMassRoll = 0.35
            MaxObtainableMassRoll = 1.00
        }
    }

}
