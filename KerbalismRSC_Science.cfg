// ============================================================
// KerbalismRSC Science Integration
//
// Defines the Kerbalism experiment/subject used by RSC samples.
//
// KerbalismRSC calculates the actual physical sample mass and
// science value at the moment RSC confirms the analysis.
//
// The runtime code converts that science value into Kerbalism's
// sample data size using SubjectData.SciencePerMB, then stores
// the physical mass separately through Drive.Record_sample().
//
// SampleMass only marks this experiment as a Kerbalism sample
// experiment. The actual physical mass is supplied dynamically
// by KerbalismRSC at analysis time.
// ============================================================

EXPERIMENT_DEFINITION
{
    id = kerbalismRSC
    title = RSC Surface Sample
    baseValue = 1
    dataScale = 1
    scienceCap = 1000
    situationMask = 1
    biomeMask = 1
    xmitDataScalar = 0
    resettable = true
    rerunnable = true

    KERBALISM_EXPERIMENT
    {
        // Non-zero so Kerbalism registers this as a sample experiment.
        // Runtime sample mass is supplied by KerbalismRSC.
        SampleMass = 0.001

        // This experiment is valid on all bodies where RSC can provide
        // a surface science spot.
        Situation = Surface@Biomes
    }
}
