// ============================================================
// RSCKerbalismED_Experiment.cfg
//
// Defines the Kerbalism experiment/subject used by
// RSCKerbalismED surface samples.
//
// RSCKerbalismED calculates the physical sample mass and science
// value when RSC confirms the analysis.
//
// The runtime code converts the calculated science value into
// Kerbalism sample data using SubjectData.SciencePerMB, then
// stores the physical sample mass separately through
// Drive.Record_sample().
//
// SampleMass defines this as a Kerbalism sample experiment.
// The actual physical sample mass is supplied dynamically by
// RSCKerbalismED at analysis time.
// ============================================================

EXPERIMENT_DEFINITION
{
    // Unique identifier used by Kerbalism and RSCKerbalismED.
    id = RSCKerbalismED

    // Display name of the experiment in Kerbalism.
    title = RSCKE Rover Sample

    // Base science value of the experiment before Kerbalism modifiers.
    baseValue = 1

    // Controls the amount of data generated by the experiment.
    dataScale = 1

    // Maximum science value that can be obtained from this experiment.
    scienceCap = 1000

    // Defines the situations in which the experiment is valid.
    situationMask = 1

    // Defines whether the experiment is biome-dependent.
    biomeMask = 1

    // Prevents the experiment from being treated as transmissible data,
    // making it a Kerbalism sample instead.
    xmitDataScalar = 0

    // Allows the experiment to be reset after being performed.
    resettable = true

    // Allows the experiment to be performed again.
    rerunnable = true

    KERBALISM_EXPERIMENT
    {
        // Defines the experiment's baseline sample mass (20kg).
        SampleMass = 0.020

        // Valid on all bodies where RSC provides a surface science spot (Surface@Biomes).
        Situation = Surface@Biomes
    }
}