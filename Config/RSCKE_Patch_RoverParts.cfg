@PART[roverBrain_A|roverBrain_B]:FOR[RSCKerbalismED]
{
	!MODULE[ModuleScienceContainer] {}

	MODULE
	{
		// Do not change. class identifier KSP uses when loading the part. Kerbalism's uses same pattern.
		name = Experiment
		// Change id accordingly
		experiment_id = RSCKerbalismED
		experiment_desc = Performs scientific analysis of a RoverScience science spot.
		// EC_RATE = 0.4 translates to 5 min - 120 EC
        ec_rate = 0.4
        // Hide property "Samples: 1"
        sample_collecting = true
        // show perpetual instead of a time.
        data_rate = 0
	}
}

// Remove RSC's original experiment definition.
// RSCKerbalismED replaces RoverScienceExperiment with its own Kerbalism experiment.
!EXPERIMENT_DEFINITION:HAS[#id[RoverScienceExperiment]] {}